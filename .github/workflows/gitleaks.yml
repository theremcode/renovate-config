name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # De action vraagt de commits van de pull request op bij de API; zonder deze
  # rechten geeft dat 403 "Resource not accessible by integration" en faalt
  # elke PR-scan — ook een schone.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Een PR-run is achterhaald zodra er een nieuwe commit komt. Op main niet: daar
  # zou afschieten een deploy halverwege stoppen.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Volledige history, zodat een pull request commit voor commit wordt gescand.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
